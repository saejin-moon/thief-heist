[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "heist_core_rs"
version = "0.1.0"
description = "High-performance native Rust core for HEIST MARL environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[tool.maturin]
features = ["pyo3/extension-module"]
