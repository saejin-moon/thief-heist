[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "thief-heist"
version = "0.1.0"
description = "THIEF in HEIST: Dynamic Mixture-of-Experts for Heterogeneous Multi-Agent Cooperation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Saejin Moon" }
]
keywords = [
    "reinforcement-learning",
    "multi-agent-reinforcement-learning",
    "marl",
    "mixture-of-experts",
    "evolutionary-computation",
    "rust",
    "pyo3",
    "pytorch",
    "cuda",
]
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "matplotlib>=3.8.0",
    "pettingzoo>=1.24.0",
    "pytest>=8.0.0",
    "lbforaging>=2.0.0",
]

[tool.maturin]
manifest-path = "src/rs/Cargo.toml"
module-name = "heist_core_rs"

[tool.pytest.ini_options]
pythonpath = ["src/py"]
testpaths = ["tests"]
